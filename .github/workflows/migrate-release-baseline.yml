name: Migrate Release Baseline

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable version to register
        required: true
        default: '4.3.95'
        type: string
      confirm:
        description: Re-enter the exact version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  migrate:
    name: Register legacy COS baseline
    runs-on: windows-latest
    environment: production
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate explicit confirmation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          EXPECTED_RELEASE_VERSION: '4.3.95'
          WORKFLOW_REF: ${{ github.ref }}
        run: node scripts/release/validate-confirmation.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify packaged and runtime updater URLs
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
        run: node scripts/release/update-url-contract.mjs

      - name: Verify COS permissions and existing baseline state
        id: status
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/cos-release.mjs status

      - name: Download and verify current public release
        if: steps.status.outputs.manifest_exists != 'true'
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DIR: legacy-canonical
        run: node scripts/release/legacy-release.mjs

      - name: Inspect existing Authenticode state
        if: steps.status.outputs.manifest_exists != 'true'
        id: signing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          function Write-GitHubOutput([string]$Name, [string]$Value) {
            do {
              $delimiter = "ghadelimiter_$([Guid]::NewGuid().ToString('N'))"
            } while (($Value -split '\r?\n|\r') -contains $delimiter)
            @("$Name<<$delimiter", $Value, $delimiter) |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          $installer = Get-ChildItem legacy-canonical -Filter "*$env:RELEASE_VERSION*.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Legacy Windows installer not found"
          }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -eq "Valid") {
            if (-not $signature.TimeStamperCertificate) {
              throw "Legacy signature is valid but has no trusted timestamp"
            }
            Write-GitHubOutput "signing_status" "signed"
            Write-GitHubOutput "signing_subject" $signature.SignerCertificate.Subject
          } elseif ($signature.Status -eq "NotSigned") {
            Write-GitHubOutput "signing_status" "unsigned"
            Write-GitHubOutput "signing_subject" ""
          } else {
            throw "Legacy Authenticode verification failed: $($signature.Status)"
          }

      - name: Capture import timestamp
        if: steps.status.outputs.manifest_exists != 'true'
        id: import-time
        shell: pwsh
        run: |
          "timestamp=$((Get-Date).ToUniversalTime().ToString('o'))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create legacy provenance and integrity metadata
        if: steps.status.outputs.manifest_exists != 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DIR: legacy-canonical
          RELEASE_BUILT_AT: ${{ steps.import-time.outputs.timestamp }}
          RELEASE_SIGNING_STATUS: ${{ steps.signing.outputs.signing_status }}
          RELEASE_SIGNING_SUBJECT: ${{ steps.signing.outputs.signing_subject }}
          RELEASE_PROVENANCE_KIND: legacy-import
          RELEASE_SOURCE_KEY: ${{ vars.COS_PREFIX }}/latest.yml
          RELEASE_OPERATOR: ${{ github.actor }}
        run: node scripts/release/prepare-release.mjs metadata

      - name: Import immutable baseline and eligibility
        if: steps.status.outputs.manifest_exists != 'true'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DIR: legacy-canonical
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cos-release.mjs import-legacy

      - name: Verify previously registered immutable baseline
        if: >-
          steps.status.outputs.manifest_exists == 'true' &&
          steps.status.outputs.ready_exists == 'true'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cos-release.mjs verify-version

      - name: Complete an interrupted baseline registration
        if: >-
          steps.status.outputs.manifest_exists == 'true' &&
          steps.status.outputs.ready_exists != 'true'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cos-release.mjs complete-legacy

      - name: Record migration summary
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNING_STATUS: ${{ steps.signing.outputs.signing_status }}
          REUSED: ${{ steps.status.outputs.manifest_exists }}
        run: |
          {
            echo "## COS release baseline registered"
            echo "- Version: $RELEASE_VERSION"
            echo "- Provenance: legacy-import"
            echo "- Authenticode: ${SIGNING_STATUS:-preserved from immutable metadata}"
            echo "- Existing metadata reused: $REUSED"
            echo "- Original build time/toolchain/commit were not fabricated."
          } >> "$GITHUB_STEP_SUMMARY"
