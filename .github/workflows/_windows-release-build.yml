name: Reusable Windows Release Build

on:
  workflow_call:
    inputs:
      version:
        description: Exact SemVer to package
        required: true
        type: string
      release_sha:
        description: Exact commit previously accepted by quality gates
        required: true
        type: string
      dry_run:
        description: Build evidence without allowing production promotion
        required: false
        default: false
        type: boolean
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.build.outputs.artifact_digest }}
      signing_status:
        value: ${{ jobs.build.outputs.signing_status }}

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    environment: production
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      signing_status: ${{ steps.signing.outputs.signing_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.release_sha }}

      - name: Validate release input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION_POLICY: equal
        run: node scripts/release/validate-release-input.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve signing mode
        id: signing
        env:
          WIN_CERTIFICATE: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          WIN_CERTIFICATE_SUBJECT_NAME: ${{ secrets.WIN_CERTIFICATE_SUBJECT_NAME }}
        run: node scripts/release/prepare-release.mjs signing

      - name: Record signing mode
        env:
          SIGNING_STATUS: ${{ steps.signing.outputs.signing_status }}
        shell: pwsh
        run: |
          "## Windows signing" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Status: $env:SIGNING_STATUS" |
            Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($env:SIGNING_STATUS -eq "unsigned") {
            Write-Warning "Windows signing certificate is not configured; this release is unsigned."
          }

      - name: Create isolated signing temp directory
        id: signing-temp
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "catimation-signing"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          "path=$directory" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Fetch Windows runtime binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm codex:fetch
          pnpm ffmpeg:fetch
          pnpm docker-mcp:fetch

      - name: Build Electron application
        run: pnpm run build:vite

      - name: Package Windows x64 artifact
        env:
          CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          TEMP: ${{ steps.signing-temp.outputs.path }}
          TMP: ${{ steps.signing-temp.outputs.path }}
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Verify Authenticode signature
        if: steps.signing.outputs.signing_status == 'signed'
        id: signature
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SUBJECT: ${{ steps.signing.outputs.signing_subject }}
        shell: pwsh
        run: |
          function Write-GitHubOutput([string]$Name, [string]$Value) {
            do {
              $delimiter = "ghadelimiter_$([Guid]::NewGuid().ToString('N'))"
            } while (($Value -split '\r?\n|\r') -contains $delimiter)
            @("$Name<<$delimiter", $Value, $delimiter) |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          $installer = Get-ChildItem release -Filter "*$env:RELEASE_VERSION*.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer not found"
          }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Authenticode verification failed: $($signature.Status)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Authenticode signature is missing a trusted timestamp"
          }
          if (
            $env:EXPECTED_SUBJECT -and
            $signature.SignerCertificate.Subject -notlike "*$env:EXPECTED_SUBJECT*"
          ) {
            throw "Signing subject does not match the configured subject"
          }
          Write-GitHubOutput "signing_subject" $signature.SignerCertificate.Subject

      - name: Cleanup signing material
        if: always()
        env:
          SIGNING_TEMP: ${{ steps.signing-temp.outputs.path }}
        shell: pwsh
        run: |
          if ($env:SIGNING_TEMP -and (Test-Path $env:SIGNING_TEMP)) {
            Remove-Item -Recurse -Force $env:SIGNING_TEMP
          }

      - name: Stage canonical files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_DIR: release
          RELEASE_DIR: release/canonical
        run: node scripts/release/prepare-release.mjs stage

      - name: Capture build timestamp
        id: build-time
        shell: pwsh
        run: |
          "timestamp=$((Get-Date).ToUniversalTime().ToString('o'))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create and verify release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DIR: release/canonical
          RELEASE_BUILT_AT: ${{ steps.build-time.outputs.timestamp }}
          RELEASE_SIGNING_STATUS: ${{ steps.signing.outputs.signing_status }}
          RELEASE_SIGNING_SUBJECT: ${{ steps.signature.outputs.signing_subject }}
          RELEASE_PROVENANCE_KIND: actions-build
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node scripts/release/prepare-release.mjs metadata

      - name: Define artifact name
        id: artifact-name
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          COMMIT_SHA: ${{ inputs.release_sha }}
        shell: pwsh
        run: |
          $prefix = if ($env:RELEASE_DRY_RUN -eq "true") { "dry-run-" } else { "" }
          "name=${prefix}release-win-$env:RELEASE_VERSION-$env:COMMIT_SHA" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload canonical artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            release/canonical/*.exe
            release/canonical/*.exe.blockmap
            release/canonical/*.yml
            release/canonical/release-manifest.json
            release/canonical/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
