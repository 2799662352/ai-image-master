name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a leading v
        required: true
        type: string
      dry_run:
        description: Validate and build without production writes
        required: false
        default: false
        type: boolean
      canonical_run_id:
        description: Trusted historical run when artifact digests differ
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}
      notes_path: ${{ steps.resolve.outputs.notes_path }}
      channel: ${{ steps.resolve.outputs.channel }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Resolve and validate release SHA
        id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          CANONICAL_RUN_ID: ${{ inputs.canonical_run_id }}
        run: node scripts/release/resolve-release-sha.mjs

  cos-preflight:
    name: COS Read-only Preflight
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      remote_state: ${{ steps.status.outputs.remote_state }}
      current_version: ${{ steps.status.outputs.current_version }}
      published_versions: ${{ steps.status.outputs.published_versions }}
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify packaged and runtime updater URLs
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
        run: node scripts/release/update-url-contract.mjs
      - name: Verify COS access and remote release state
        id: status
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cos-release.mjs status
      - name: Enforce forward-only release progression
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG_EXISTS: ${{ needs.validate.outputs.tag_exists }}
          CURRENT_CHANNEL_VERSION: ${{ steps.status.outputs.current_version }}
          PUBLISHED_VERSIONS: ${{ steps.status.outputs.published_versions }}
        run: node scripts/release/validate-channel-progress.mjs

  quality:
    name: Quality Gate
    needs: [validate, cos-preflight]
    uses: ./.github/workflows/_quality-gates.yml
    with:
      ref: ${{ needs.validate.outputs.release_sha }}

  discover:
    name: Discover Canonical Artifact
    needs: [validate, cos-preflight, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.discover.outputs.source }}
      needs_build: ${{ steps.discover.outputs.needs_build }}
      run_id: ${{ steps.discover.outputs.run_id }}
      artifact_name: ${{ steps.discover.outputs.artifact_name }}
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select trusted source
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          CANONICAL_RUN_ID: ${{ inputs.canonical_run_id }}
          COS_REMOTE_STATE: ${{ needs.cos-preflight.outputs.remote_state }}
          RELEASE_TAG_EXISTS: ${{ needs.validate.outputs.tag_exists }}
        run: node scripts/release/discover-canonical.mjs

  build:
    name: Build Canonical Windows Artifact
    needs: [validate, quality, discover]
    if: needs.discover.outputs.needs_build == 'true'
    uses: ./.github/workflows/_windows-release-build.yml
    with:
      version: ${{ inputs.version }}
      release_sha: ${{ needs.validate.outputs.release_sha }}
      dry_run: ${{ inputs.dry_run }}

  canonical:
    name: Verify Canonical Artifact
    needs: [validate, discover, build]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.discover.result == 'success' &&
        (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_name: ${{ steps.canonical-name.outputs.name }}
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stop when remote state has no canonical artifact
        if: needs.discover.outputs.source == 'unrecoverable'
        run: |
          echo "Remote immutable state exists but no trusted canonical artifact is available."
          exit 1
      - name: Download newly built artifact
        if: needs.discover.outputs.source == 'build'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: canonical
      - name: Download trusted historical Actions artifact
        if: needs.discover.outputs.source == 'actions'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.discover.outputs.artifact_name }}
          path: canonical
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.discover.outputs.run_id }}
      - name: Download existing GitHub Release assets
        if: needs.discover.outputs.source == 'github-release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: >-
          gh release download "$RELEASE_TAG"
          --dir canonical
          --pattern "*.exe"
          --pattern "*.exe.blockmap"
          --pattern "*.yml"
          --pattern "release-manifest.json"
          --pattern "SHA256SUMS.txt"
      - name: Verify canonical artifact
        env:
          RELEASE_DIR: canonical
        run: node scripts/release/prepare-release.mjs verify
      - name: Define normalized canonical name
        id: canonical-name
        env:
          SOURCE: ${{ needs.discover.outputs.source }}
          BUILT_NAME: ${{ needs.build.outputs.artifact_name }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          if [ "$SOURCE" = "build" ]; then
            echo "name=$BUILT_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=release-win-$RELEASE_VERSION-$RELEASE_SHA-reused" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve recovered canonical artifact
        if: needs.discover.outputs.source != 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.canonical-name.outputs.name }}
          path: canonical/
          if-no-files-found: error
          retention-days: 90

  authenticode:
    name: Verify Canonical Authenticode
    needs: canonical
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download canonical artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.canonical.outputs.artifact_name }}
          path: canonical
      - name: Verify declared Windows signature state
        shell: pwsh
        run: |
          $manifestPath = Join-Path $PWD "canonical/release-manifest.json"
          if (-not (Test-Path $manifestPath)) {
            throw "release-manifest.json is missing"
          }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $installers = @(
            $manifest.files |
              Where-Object { $_.name -match '\.exe$' }
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer in release-manifest.json"
          }
          $installerPath = Join-Path $PWD "canonical/$($installers[0].name)"
          if (-not (Test-Path $installerPath)) {
            throw "Declared Windows installer is missing"
          }
          $signature = Get-AuthenticodeSignature $installerPath
          if ($manifest.signing.status -eq "signed") {
            if ($signature.Status -ne "Valid") {
              throw "Recovered Authenticode signature is invalid: $($signature.Status)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "Recovered Authenticode signature has no trusted timestamp"
            }
            if (
              $manifest.signing.subject -and
              $signature.SignerCertificate.Subject -ne $manifest.signing.subject
            ) {
              throw "Recovered Authenticode subject does not match release-manifest.json"
            }
          } elseif ($manifest.signing.status -eq "unsigned") {
            if ($signature.Status -ne "NotSigned") {
              throw "Installer signature state does not match unsigned metadata"
            }
          } else {
            throw "Unsupported signing status in release-manifest.json"
          }
          "## Canonical Authenticode`n- Status: $($manifest.signing.status)" |
            Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  publish:
    name: Publish GitHub and COS
    needs: [validate, quality, canonical, authenticode]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      release_url: ${{ steps.github_release.outputs.release_url }}
      current_version: ${{ steps.promote.outputs.current_version }}
      restored_version: ${{ steps.promote.outputs.restored_version }}
      github_draft_outcome: ${{ steps.github_draft.outcome }}
      github_release_outcome: ${{ steps.github_release.outcome }}
      cos_upload_outcome: ${{ steps.cos_upload.outcome }}
      ready_outcome: ${{ steps.mark_ready.outcome }}
      promote_outcome: ${{ steps.promote.outcome }}
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download canonical artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.canonical.outputs.artifact_name }}
          path: canonical
      - name: Create or verify draft and GitHub assets
        id: github_draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          RELEASE_DIR: canonical
          RELEASE_NOTES_PATH: ${{ needs.validate.outputs.notes_path }}
        run: node scripts/release/github-release.mjs ensure-draft
      - name: Upload and verify immutable COS assets
        id: cos_upload
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DIR: canonical
        run: node scripts/release/cos-release.mjs upload-assets
      - name: Publish and re-verify GitHub Release
        id: github_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          RELEASE_DIR: canonical
          RELEASE_NOTES_PATH: ${{ needs.validate.outputs.notes_path }}
        run: node scripts/release/github-release.mjs publish
      - name: Create deterministic release-ready marker
        id: create_ready
        env:
          RELEASE_DIR: canonical
          RELEASE_READY_AT: ${{ steps.github_release.outputs.published_at }}
          GITHUB_RELEASE_ID: ${{ steps.github_release.outputs.release_id }}
          GITHUB_RELEASE_PUBLISHED_AT: ${{ steps.github_release.outputs.published_at }}
        run: node scripts/release/prepare-release.mjs ready
      - name: Upload verified release-ready marker
        id: mark_ready
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_READY_PATH: canonical/release-ready.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cos-release.mjs mark-ready
      - name: Promote COS channel and verify public endpoint transactionally
        id: promote
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cos-release.mjs promote

  summary:
    name: Release Summary
    needs:
      - validate
      - cos-preflight
      - quality
      - discover
      - build
      - canonical
      - authenticode
      - publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout summary renderer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
      - name: Download canonical artifact when available
        if: needs.canonical.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.canonical.outputs.artifact_name }}
          path: canonical
      - name: Write unified release summary
        if: always()
        env:
          RELEASE_DIR: canonical
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PREFLIGHT_RESULT: ${{ needs.cos-preflight.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CANONICAL_RESULT: ${{ needs.canonical.result }}
          AUTHENTICODE_RESULT: ${{ needs.authenticode.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          GITHUB_RELEASE_URL: ${{ needs.publish.outputs.release_url }}
          GITHUB_DRAFT_OUTCOME: ${{ needs.publish.outputs.github_draft_outcome }}
          GITHUB_RELEASE_OUTCOME: ${{ needs.publish.outputs.github_release_outcome }}
          COS_UPLOAD_OUTCOME: ${{ needs.publish.outputs.cos_upload_outcome }}
          READY_OUTCOME: ${{ needs.publish.outputs.ready_outcome }}
          PROMOTE_OUTCOME: ${{ needs.publish.outputs.promote_outcome }}
          PUBLIC_OUTCOME: ${{ needs.publish.outputs.promote_outcome }}
          CURRENT_CHANNEL_VERSION: ${{ needs.publish.outputs.current_version }}
          RESTORED_CHANNEL_VERSION: ${{ needs.publish.outputs.restored_version }}
        run: node scripts/release/write-release-summary.mjs
