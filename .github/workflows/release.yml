name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      skip_tests:
        description: 'Skip tests before release'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test:run

      - name: Build for E2E tests
        run: pnpm run build:vite
        env:
          NODE_ENV: test

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: true
          DISPLAY: ':99'

      - name: Upload E2E test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

  release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [validate]
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          # - os: ubuntu-latest
          #   platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with electron-vite
        run: pnpm run build:vite
        env:
          NODE_ENV: production

      - name: Build and publish (Windows)
        if: matrix.platform == 'win'
        run: pnpm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          WIN_CERTIFICATE_SUBJECT_NAME: ${{ secrets.WIN_CERTIFICATE_SUBJECT_NAME }}

      - name: Build and publish (macOS)
        if: matrix.platform == 'mac'
        run: pnpm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating full changelog"
            CHANGES=$(git log --oneline --no-merges | head -50)
          else
            echo "Previous tag: $PREV_TAG"
            CHANGES=$(git log --oneline --no-merges ${PREV_TAG}..HEAD)
          fi

          FEATURES=$(echo "$CHANGES" | grep -iE '(feat|add|new)' || true)
          FIXES=$(echo "$CHANGES" | grep -iE '(fix|bug|patch)' || true)
          IMPROVEMENTS=$(echo "$CHANGES" | grep -iE '(improve|update|enhance|refactor)' || true)
          OTHER=$(echo "$CHANGES" | grep -ivE '(feat|add|new|fix|bug|patch|improve|update|enhance|refactor)' || true)

          BODY="## What's Changed in v${{ steps.get_version.outputs.VERSION }}\n\n"

          if [ -n "$FEATURES" ]; then
            BODY="${BODY}### New Features\n\n$FEATURES\n\n"
          fi

          if [ -n "$FIXES" ]; then
            BODY="${BODY}### Bug Fixes\n\n$FIXES\n\n"
          fi

          if [ -n "$IMPROVEMENTS" ]; then
            BODY="${BODY}### Improvements\n\n$IMPROVEMENTS\n\n"
          fi

          if [ -n "$OTHER" ]; then
            BODY="${BODY}### Other Changes\n\n$OTHER\n\n"
          fi

          echo -e "$BODY" > changelog.md

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find release-artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.yml
            release-artifacts/**/*.blockmap
          draft: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.md
          retention-days: 30
