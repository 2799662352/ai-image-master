appId: com.catimation.cyberpunk-master
productName: CATIMATION-Cyberpunk Master
copyright: Copyright © 2024-2026 CATIMATION

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - "!dist/win-unpacked/**"
  - package.json
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - "!**/node_modules/.cache/**"
  - "!**/.git/**"
  - "!**/.gitignore"
  - "!**/.env*"
  - "!**/tsconfig*.json"
  - "!**/electron.vite.config.*"
  - "!**/vite.config.*"
  - "!**/playwright.config.*"
  - "!**/vitest.config.*"
  - "!**/*.md"
  - "dist/renderer/data/**/*.md"
  - "!**/docs/**"
  - "!**/tests/**"
  - "!**/e2e/**"
  - "!**/build/**"
  - "!**/.vscode/**"
  - "!**/.cursor/**"

extraResources:
  - from: skills
    to: skills
    filter:
      - "**/*.md"
  - from: resources/codex/${platform}-${arch}
    to: codex/${platform}-${arch}
    filter:
      - "codex*"
  - from: resources/docker-mcp/${platform}-${arch}
    to: docker-mcp/${platform}-${arch}
    filter:
      - "docker-mcp*"
  # Vendored apiyi-mcp-server (resolves to <resourcesPath>/apiyi-mcp/dist/index.js
  # at runtime via src/main/agent/apiyiMcpLauncher.ts). Pure Node, no per-platform
  # subdir. Vendored by scripts/vendor-apiyi-mcp.mjs as part of `npm run build`.
  #
  # CRITICAL: node_modules MUST be a separate `from:` entry (NOT nested under
  # `from: resources/apiyi-mcp`), and we must explicitly negate node_modules
  # in the parent entry's filter.
  #
  # Why: electron-builder 26.x has a hard-coded special path for the directory
  # name `node_modules` in its source-tree walker. When you point `from:` at
  # `resources/apiyi-mcp` (which contains a `node_modules/` child), the walker
  # treats that nested directory as a "production deps tree" and routes it
  # through `searchAndCopyNodeModules()` instead of plain `cpRecursive()`.
  # That helper reads the parent `package.json`, resolves only listed
  # production deps, and copies those — but since the main project's
  # `package.json` doesn't declare `@modelcontextprotocol/sdk` or
  # `@google/genai` (they're transitively vendored under apiyi-mcp), it
  # finds nothing to copy and the entire nested node_modules silently
  # disappears from the packaged tree.
  #
  # In v4.3.16–v4.3.20 attempt 1 this caused packaged installers to ship
  # resources/apiyi-mcp/ with `dist/` + 4 metadata files but ZERO node_modules/.
  # End users on machines without system Node fell back to
  # ELECTRON_RUN_AS_NODE=1 spawning dist/index.js, which crashed instantly
  # on `Cannot find module '@modelcontextprotocol/sdk'`. codex reported 0
  # tools and the UI looked alive but returned nothing even with a valid key.
  #
  # The fix is to bypass the smart walker entirely by listing node_modules
  # as its OWN top-level extraResources entry. The walker sees a `from:` that
  # already points INSIDE a node_modules directory and just plain-copies it
  # (no "production deps resolution" smart path is triggered because there's
  # no parent package.json above it to read).
  - from: resources/apiyi-mcp
    to: apiyi-mcp
    filter:
      - "**/*"
      - "!node_modules"
      - "!node_modules/**/*"
  - from: resources/apiyi-mcp/node_modules
    to: apiyi-mcp/node_modules
    filter:
      - "**/*"
  - from: resources/skills
    to: skills
    filter:
      - "**/*"
  # System-scope Codex Agent skills (deep-agents-*, etc.) shipped read-only
  # with the installer. resolveWorkspacePaths exposes these under the
  # 'system' skill scope (per Codex docs:
  # https://developers.openai.com/codex/skills) when app.isPackaged === true.
  - from: .agents/skills
    to: .agents/skills
    filter:
      - "**/*.md"
  # NOTE: bundled Codex-only skills (codex-research-grounded-prompting + the
  # 19 cookbook skills under `resources/codex-skills/`) used to be shipped in
  # the installer and auto-mirrored to `$HOME/.agents/skills/` on every
  # launch. Starting v4.3.5 they ship out-of-band through the Skill
  # Marketplace (catalog.json + per-skill zips on Tencent COS) — the user
  # picks which ones they want via the in-app marketplace page. The source
  # tree at `resources/codex-skills/` is now the catalog upload source
  # (see `scripts/upload-skills-to-cos.mjs`) and is no longer copied into
  # the installer.

asarUnpack:
  - resources/**
  - "**/node_modules/@electric-sql/pglite/**"
  # Native C++ addon — required at runtime by AttachmentDirWatcher. The
  # `@parcel/watcher-<platform>-<arch>` prebuilt binary packages each contain
  # a `.node` file that node-loader can only dlopen() from a real file path,
  # so they must live outside the asar. The wildcard `watcher*` catches the
  # wrapper package AND every platform-specific binary subpackage.
  - "**/node_modules/@parcel/watcher*/**"

asar: true
compression: maximum
removePackageScripts: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  legalTrademarks: CATIMATION-Cyberpunk Master
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CATIMATION Cyberpunk Master
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages:
    - zh_CN
    - en_US
  language: "2052"
  runAfterFinish: true
  artifactName: ${name}-${version}-setup.${ext}
  differentialPackage: true

mac:
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.graphics-design
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.

dmg:
  title: ${productName}
  icon: build/icon.png
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Graphics
  maintainer: CATIMATION <hi@lazycat.ai>
  synopsis: AI图片生成桌面应用
  description: AI Image Generation Desktop Application with multi-model support

appImage:
  artifactName: ${productName}-${version}.${ext}

deb:
  artifactName: ${productName}-${version}.${ext}
  depends:
    - libnotify4
    - libxtst6
    - libnss3

publish:
  - provider: generic
    url: https://map-tiles-bucket-1345773498.cos.ap-guangzhou.myqcloud.com/releases/
    channel: latest
    useMultipleRangeRequest: true
# NOTE: The GitHub publish provider was intentionally removed — the
# repository is now private and end users in mainland China can't reliably
# reach GitHub Releases. Updates flow exclusively through the Tencent COS
# CDN above. GitHub is used only to host source code; never for binaries.

generateUpdatesFilesForAllChannels: true
